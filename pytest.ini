[pytest]
pythonpath = .
testpaths = tests
addopts = --cov=parking --cov-branch --cov-report=term-missing
markers =
    unit: unit-level tests (single module)
    integration: tests spanning several modules / SQLite / CLI
    blackbox: derived from rules only (BVA, EP, decision table)
    whitebox: derived from code structure (branch / path coverage)
